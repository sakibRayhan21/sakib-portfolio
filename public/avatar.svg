<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2a882" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Geometric Grid & Circuit Accents -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3" />
  <circle cx="200" cy="180" r="160" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15" />
  <circle cx="60" cy="80" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="340" cy="100" r="4" fill="#8b5cf6" opacity="0.6" />
  <circle cx="320" cy="280" r="3" fill="#38bdf8" opacity="0.5" />

  <!-- Code Symbols floating -->
  <text x="50" y="140" fill="#3b82f6" font-family="monospace" font-size="16" opacity="0.4">&lt;/&gt;</text>
  <text x="320" y="200" fill="#a855f7" font-family="monospace" font-size="18" opacity="0.4">{ ; }</text>
  <text x="70" y="260" fill="#06b6d4" font-family="monospace" font-size="14" opacity="0.3">const dev = true;</text>

  <!-- Glowing Aura behind Avatar -->
  <circle cx="200" cy="190" r="100" fill="#2563eb" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Shoulders & Hoodie -->
  <path d="M100 400 C100 320, 140 280, 200 280 C260 280, 300 320, 300 400 Z" fill="url(#clothGrad)" />
  <!-- Hoodie Zipper / Accent lines -->
  <path d="M198 285 L198 400" stroke="#3b82f6" stroke-width="3" opacity="0.8" />
  <!-- Collar -->
  <path d="M165 280 C180 305, 220 305, 235 280 C215 292, 185 292, 165 280 Z" fill="#0f172a" />

  <!-- Neck -->
  <rect x="185" y="230" width="30" height="55" rx="5" fill="url(#skinGrad)" />

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skinGrad)" />

  <!-- Hair Modern Style -->
  <path d="M140 170 C135 125, 165 100, 200 100 C240 100, 265 120, 260 170 C250 135, 230 115, 200 115 C170 115, 148 135, 140 170 Z" fill="#1e1b4b" />
  <path d="M142 160 C140 120, 185 95, 225 102 C255 108, 262 135, 262 165 C255 125, 220 110, 185 118 C160 125, 145 145, 142 160 Z" fill="#0f172a" />

  <!-- Modern Glasses -->
  <rect x="155" y="165" width="38" height="26" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.9" />
  <rect x="207" y="165" width="38" height="26" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5" opacity="0.9" />
  <line x1="193" y1="175" x2="207" y2="175" stroke="#38bdf8" stroke-width="3.5" opacity="0.9" />
  <line x1="140" y1="172" x2="155" y2="175" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <line x1="245" y1="175" x2="260" y2="172" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <!-- Glass glare reflection -->
  <line x1="160" y1="170" x2="175" y2="185" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
  <line x1="212" y1="170" x2="227" y2="185" stroke="#ffffff" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="178" r="4" fill="#1e293b" />
  <circle cx="226" cy="178" r="4" fill="#1e293b" />

  <!-- Nose -->
  <path d="M197 188 C198 198, 203 198, 204 188" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Friendly Smile -->
  <path d="M185 210 Q200 222 215 210" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Modern Square Corner Framing Accent -->
  <rect x="15" y="15" width="370" height="370" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
</svg>
